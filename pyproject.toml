[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shar"
version = "0.1.0"
description = "Timestamp-grounded multimodal action recognition and localization"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "av>=14", "Pillow>=11", "numpy>=2", "scipy>=1.14", "fastapi>=0.115", "uvicorn>=0.34", "python-multipart>=0.0.20", "sqlalchemy>=2,<3", "alembic>=1.14", "httpx>=0.28", "typer>=0.15"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0,<2"]
stream = ["opencv-python-headless>=4.10"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "build"]

[project.scripts]
shar = "shar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shar"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "shar/prompt_templates"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
